name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
    tags:
    - '*'
  pull_request:
    types: [ opened, synchronize, reopened ]
  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
          
    - name: Build and Test with Maven
      run: mvn -B clean install --file pom.xml
      
    - name: Set up Docker Buildx
      if: success()
      uses: docker/setup-buildx-action@v3
      
    - name: Set Docker image name
      if: success()
      env:
        REF_NAME: ${{ github.ref_name }}
        DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      run: |
        SAFE_REF=$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
        SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
        echo "DOCKER_IMAGE_NAME=$(echo "$DOCKERHUB_USERNAME/secor" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        echo "DOCKER_IMAGE_TAG=${SAFE_REF}_${SHORT_SHA}" >> $GITHUB_ENV

    # Push target: Docker Hub sanketikahub/secor (plain docker.io login).
    # Docker steps below are skipped on pull_request: this workflow's pull_request trigger has
    # no fork/approval gate, so any PR build would otherwise publish straight to the production
    # sanketikahub/secor repo, including :latest.
    - name: Log in to Docker Hub (push target)
      if: success() && github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # DHI base pull: dhi.io needs the sanketikahub DHI-entitled Docker Hub creds. registry: dhi.io
    # is required — the spotify docker plugin won't map a plain docker.io login to a dhi.io pull.
    - name: Log in to DHI registry (dhi.io) for the base image
      if: success() && github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: dhi.io
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker Image
      if: success() && github.event_name != 'pull_request'
      run: mvn clean install -DskipTests -Pbuild-docker-image -Ddockerfile.repository=${{ env.DOCKER_IMAGE_NAME }} -Ddockerfile.tag=${{ env.DOCKER_IMAGE_TAG }} --file pom.xml

    - name: Tag Docker Image
      if: success() && github.event_name != 'pull_request'
      run: docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }} ${{ env.DOCKER_IMAGE_NAME }}:latest

    # Fail before publishing rather than after: catches a DHI base swap that builds cleanly but
    # can't actually run (e.g. entrypoint fails as non-root, java missing from PATH).
    - name: Verify image runs
      if: success() && github.event_name != 'pull_request'
      run: docker run --rm ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }} java -version

    - name: Push Docker Image
      if: success() && github.event_name != 'pull_request'
      run: |
        docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ env.DOCKER_IMAGE_TAG }}
        docker push ${{ env.DOCKER_IMAGE_NAME }}:latest

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: secor-jar
        path: target/*.jar
        retention-days: 30
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: target/surefire-reports/
        retention-days: 30
