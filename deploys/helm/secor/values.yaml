image:
  prefix: us.gcr.io/secor-demo/
  repository: secor
  # Pinned image tag. Leave empty to default to the chart's appVersion.
  tag: ""
  pullPolicy: Always

# Pod-level security context. The secor image (see the repo Dockerfile) creates
# and runs as the non-root user/group 9999; fsGroup makes the mounted PVC and
# secret volumes writable/readable by that user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 9999
  runAsGroup: 9999
  fsGroup: 9999
  seccompProfile:
    type: RuntimeDefault

# Container-level security context, applied to every container in the pods.
# readOnlyRootFilesystem is safe here: secor writes only to its local data path
# (the "local-var" PVC) and to /tmp, which is backed by an emptyDir volume.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 9999
  runAsGroup: 9999
  privileged: false
  capabilities:
    drop:
      - ALL

secor:
  zookeeper:
    quorum: "zookeeper:2181"
    path: "/"
  backup:
    configFile: /opt/secor/config/secor.kubernetes-dev.backup.properties
    logConfigFile: /opt/secor/config/log4j2.docker.properties
    monitor:
      logConfigFile: /opt/secor/config/log4j2.docker-warn.properties
    storage:
      class: standard
      size: 20Gi
    jvm:
      memory: 512m
    resources:
      requests:
        cpu: 800m
        memory: 768Mi
  partition:
    configFile: /opt/secor/config/secor.kubernetes-dev.partition.properties
    logConfigFile: /opt/secor/config/log4j2.docker.properties
    monitor:
      logConfigFile: /opt/secor/config/log4j2.docker-warn.properties
    storage:
      class: standard
      size: 20Gi
    jvm:
      memory: 512m
    resources:
      requests:
        cpu: 800m
        memory: 768Mi
 

exporter:
  image:
    repository: prom/statsd-exporter
    tag: v0.27.1
    pullPolicy: IfNotPresent
